[client]
default_env = aws

[authentication]
api_base_url = https://api.example.org
user_role_path = /user/role
login_timeout_seconds = 30

[share]
url = https://dev-app.example.org/?s=0
recent_urls = https://dev-app.example.org/?s=0,http://localhost:3000

[startup_kit]
# Site workspaces are managed under ~/.duality-client/<assigned-client-name>
# so startup-kit content and job results persist across supervisor upgrades/moves.
extract_base = app_home

[content_delivery]
api_base_url = https://api.example.org
startup_kit_path = /clients/content/startup-kit
download_timeout_seconds = 300

[nvflare]
job_results_dir_name = job-results

[results]
port = 8088
health_interval_seconds = 30
